<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping list</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shopping list">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="version.js"></script>
<script>
  // Set the theme before the first paint, so a chosen theme never flashes the wrong colours.
  try {
    var savedTheme = JSON.parse(localStorage.getItem('shopping-list-settings') || '{}').theme;
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (_) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #77746c;
    --line: #e7e4dc; --accent: #2f7d5b; --accent-soft: #e4f1ea; --danger: #b54134;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { color-scheme: dark;
      --bg: #161614; --card: #201f1c; --ink: #f1efe9; --muted: #9a968c;
      --line: #33312c; --accent: #5cbf91; --accent-soft: #1f3529; --danger: #e07a6d; }
  }
  :root[data-theme=dark] { color-scheme: dark;
    --bg: #161614; --card: #201f1c; --ink: #f1efe9; --muted: #9a968c;
    --line: #33312c; --accent: #5cbf91; --accent-soft: #1f3529; --danger: #e07a6d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 18px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .head-right { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .count { color: var(--muted); font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  input.qty { flex: 0 0 76px; }
  button { font: inherit; cursor: pointer; border: none; }
  .add { background: var(--accent); color: #fff; font-weight: 600; padding: 0 18px; border-radius: 12px; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .chip { background: transparent; border: 1px dashed var(--line); color: var(--muted);
    padding: 5px 10px; border-radius: 999px; font-size: 13px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
  .sec-head { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); }
  .link { background: none; color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .link:hover { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: none; }
  .box { flex: 0 0 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line);
    background: transparent; display: grid; place-items: center; padding: 0; }
  .box:hover { border-color: var(--accent); }
  .done .box { background: var(--accent); border-color: var(--accent); }
  .box svg { width: 13px; height: 13px; opacity: 0; }
  .done .box svg { opacity: 1; }
  .name { flex: 1; font-size: 16px; word-break: break-word; }
  .q { color: var(--muted); font-size: 14px; margin-left: 6px; }
  .done .name { color: var(--muted); text-decoration: line-through; }
  .del { background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 6px; opacity: 0.5; }
  li:hover .del { opacity: 1; }
  .del:hover { color: var(--danger); }
  .empty { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 15px; }
  .status { text-align: center; color: var(--muted); font-size: 12px; min-height: 16px; }
  .readonly form, .readonly .chips, .readonly .del, .readonly .link { display: none; }
  .icon-btn { background: none; color: var(--muted); width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center; padding: 0; }
  .icon-btn:hover { color: var(--accent); }
  .icon-btn svg { width: 22px; height: 22px; display: block; }
  dialog { width: 100%; max-width: 520px; margin: auto auto 0; padding: 0; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-bottom: none; border-radius: 16px 16px 0 0; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .sheet { padding: 12px 18px 24px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head h2 { font-size: 20px; margin: 0; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { background: none; color: var(--muted); font-size: 14px; padding: 8px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .version { color: var(--muted); }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1 data-t="title">Shopping list</h1>
    <div class="head-right">
      <span class="count" id="count"></span>
      <button class="icon-btn" id="openSettings" type="button" data-t-label="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <form id="addForm" autocomplete="off">
    <input type="text" id="itemInput" data-t-placeholder="addPlaceholder" data-t-label="item" placeholder="Add an item…" aria-label="Item">
    <input type="text" id="qtyInput" class="qty" data-t-placeholder="qty" data-t-label="quantity" placeholder="Qty" aria-label="Quantity">
    <button class="add" type="submit" data-t="add">Add</button>
  </form>

  <div class="chips" id="chips"></div>

  <section>
    <div class="sec-head"><span data-t="toBuy">To buy</span></div>
    <ul id="todo"></ul>
  </section>

  <section id="doneSec">
    <div class="sec-head"><span data-t="inCart">In the cart</span><button class="link" id="clearDone" type="button" data-t="clear">Clear</button></div>
    <ul id="done"></ul>
  </section>

  <div class="status" id="status"></div>
</main>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="settingsTitle" data-t="settings">Settings</h2>
      <button class="icon-btn" id="closeSettings" type="button" data-t-label="close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="setting">
      <span data-t="language">Language</span>
      <div class="seg" id="langChoice">
        <button type="button" data-value="no">Norsk</button>
        <button type="button" data-value="en">English</button>
      </div>
    </div>
    <div class="setting">
      <span data-t="appearance">Appearance</span>
      <div class="seg" id="themeChoice">
        <button type="button" data-value="system" data-t="system">System</button>
        <button type="button" data-value="light" data-t="light">Light</button>
        <button type="button" data-value="dark" data-t="dark">Dark</button>
      </div>
    </div>
    <div class="setting">
      <span data-t="version">Version</span>
      <span class="version" id="versionValue"></span>
    </div>
  </div>
</dialog>

<script type="application/json" id="state">{"items":[]}</script>

<script>
(function () {
  // Pristine copy of this page, taken before anything is rendered.
  // Saving = swap the state JSON inside it and publish the whole document.
  var TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var STATE_RE = /(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/;

  var state;
  try { state = JSON.parse(document.getElementById('state').textContent); } catch (e) { state = { items: [] }; }
  if (!state.items) state.items = [];

  // Quick items as [English, Norwegian].
  var QUICK = [['Milk', 'Melk'], ['Bread', 'Brød'], ['Eggs', 'Egg'], ['Butter', 'Smør'], ['Cheese', 'Ost'], ['Coffee', 'Kaffe'],
    ['Bananas', 'Bananer'], ['Apples', 'Epler'], ['Chicken', 'Kylling'], ['Pasta', 'Pasta'], ['Rice', 'Ris'], ['Toilet paper', 'Toalettpapir']];

  var TEXT = {
    en: {
      title: 'Shopping list', addPlaceholder: 'Add an item…', qty: 'Qty', add: 'Add', item: 'Item', quantity: 'Quantity',
      toBuy: 'To buy', inCart: 'In the cart', clear: 'Clear', empty: 'Nothing to buy — add something above.',
      left: ' left', allDone: 'All done ✓', toggle: 'Toggle', remove: 'Remove', saving: 'Saving…', saved: 'Saved on this device',
      settings: 'Settings', close: 'Close', language: 'Language', appearance: 'Appearance',
      system: 'System', light: 'Light', dark: 'Dark', version: 'Version'
    },
    no: {
      title: 'Handleliste', addPlaceholder: 'Legg til en vare…', qty: 'Antall', add: 'Legg til', item: 'Vare', quantity: 'Antall',
      toBuy: 'Å kjøpe', inCart: 'I handlekurven', clear: 'Tøm', empty: 'Ingenting å kjøpe – legg til noe over.',
      left: ' igjen', allDone: 'Alt er kjøpt ✓', toggle: 'Kryss av', remove: 'Fjern', saving: 'Lagrer…', saved: 'Lagret på denne enheten',
      settings: 'Innstillinger', close: 'Lukk', language: 'Språk', appearance: 'Utseende',
      system: 'System', light: 'Lys', dark: 'Mørk', version: 'Versjon'
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var artifact = null, saveTimer = null, readOnly = false, LS_KEY = 'shopping-list-fallback', SETTINGS_KEY = 'shopping-list-settings';

  var settings = {};
  try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; } catch (_) {}
  if (!TEXT[settings.lang]) settings.lang = /^(no|nb|nn)\b/i.test(navigator.language || '') ? 'no' : 'en';
  if (['system', 'light', 'dark'].indexOf(settings.theme) < 0) settings.theme = 'system';

  function t(key) { return TEXT[settings.lang][key]; }
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) {} }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function row(it) {
    return '<li class="' + (it.done ? 'done' : '') + '" data-id="' + it.id + '">' +
      '<button class="box" type="button" aria-label="' + t('toggle') + ' ' + esc(it.name) + '">' + CHECK + '</button>' +
      '<span class="name">' + esc(it.name) + (it.qty ? '<span class="q">× ' + esc(it.qty) + '</span>' : '') + '</span>' +
      '<button class="del" type="button" aria-label="' + t('remove') + ' ' + esc(it.name) + '">×</button></li>';
  }

  function render() {
    var todo = state.items.filter(function (i) { return !i.done; });
    var done = state.items.filter(function (i) { return i.done; });
    $('todo').innerHTML = todo.length ? todo.map(row).join('') : '<div class="empty">' + t('empty') + '</div>';
    $('done').innerHTML = done.map(row).join('');
    $('doneSec').style.display = done.length ? '' : 'none';
    $('count').textContent = todo.length ? todo.length + t('left') : (done.length ? t('allDone') : '');
    var have = {};
    state.items.forEach(function (i) { if (!i.done) have[i.name.toLowerCase()] = 1; });
    var quickIndex = settings.lang === 'no' ? 1 : 0;
    $('chips').innerHTML = QUICK.filter(function (q) { return !have[q[0].toLowerCase()] && !have[q[1].toLowerCase()]; })
      .map(function (q) { return esc(q[quickIndex]); })
      .map(function (q) { return '<button class="chip" type="button" data-q="' + q + '">+ ' + q + '</button>'; }).join('');
  }

  function applyLanguage() {
    document.documentElement.lang = settings.lang === 'no' ? 'nb' : 'en';
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-t-placeholder]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-t-placeholder')); });
    document.querySelectorAll('[data-t-label]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-t-label'))); });
    status('');
    render();
  }

  function applyTheme() {
    var root = document.documentElement, metas = document.querySelectorAll('meta[name=theme-color]');
    var dark = settings.theme === 'dark' || (settings.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (settings.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', settings.theme);
    metas[0].content = settings.theme === 'dark' ? '#161614' : '#f6f5f1';
    metas[1].content = settings.theme === 'light' ? '#f6f5f1' : '#161614';
    // The Android app matches its system bars and background to the page.
    if (window.AndroidApp) window.AndroidApp.setDarkTheme(dark);
  }

  function markChoice(id, value) {
    $(id).querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-value') === value)); });
  }

  function status(msg) { $('status').textContent = msg || ''; }

  function save() {
    if (readOnly) return;
    clearTimeout(saveTimer);
    status(t('saving'));
    doSave();
  }

  function doSave() {
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    if (artifact) {
      var html = TEMPLATE.replace(STATE_RE, function (_, a, b) { return a + json + b; });
      Promise.resolve(artifact.publish(html)).then(function () { status('Saved'); }).catch(function (err) {
        var code = (err && (err.code || err.message)) || '';
        if (/not_granted|not_writer/.test(code)) { setReadOnly(); }
        else if (/conflict/.test(code)) { status('Updated elsewhere — reloading…'); }
        else { status('Could not save — try again'); }
      });
    } else {
      try { localStorage.setItem(LS_KEY, json); status(t('saved')); } catch (e) { status(''); }
    }
  }

  function setReadOnly() { readOnly = true; document.body.classList.add('readonly'); status('View only'); }

  function addItem(name, qty) {
    name = (name || '').trim(); qty = (qty || '').trim();
    if (!name) return;
    var existing = state.items.find(function (i) { return !i.done && i.name.toLowerCase() === name.toLowerCase(); });
    if (existing) { if (qty) existing.qty = qty; }
    else state.items.unshift({ id: uid(), name: name, qty: qty, done: false });
    render(); save();
  }

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    addItem($('itemInput').value, $('qtyInput').value);
    $('itemInput').value = ''; $('qtyInput').value = '';
    try { sessionStorage.removeItem('sl-draft'); } catch (_) {}
    $('itemInput').focus();
  });

  // Keep an unfinished entry if the page reloads after a save.
  $('itemInput').addEventListener('input', function () {
    try { sessionStorage.setItem('sl-draft', this.value); } catch (_) {}
  });
  try { var d = sessionStorage.getItem('sl-draft'); if (d) $('itemInput').value = d; } catch (_) {}

  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (b) addItem(b.getAttribute('data-q'), '');
  });

  document.addEventListener('click', function (e) {
    var li = e.target.closest('li[data-id]'); if (!li || readOnly) return;
    var id = li.getAttribute('data-id');
    var it = state.items.find(function (i) { return i.id === id; }); if (!it) return;
    if (e.target.closest('.del')) { state.items = state.items.filter(function (i) { return i.id !== id; }); render(); save(); }
    else if (e.target.closest('.box') || e.target.closest('.name')) { it.done = !it.done; render(); save(); }
  });

  $('clearDone').addEventListener('click', function () {
    state.items = state.items.filter(function (i) { return !i.done; }); render(); save();
  });

  $('openSettings').addEventListener('click', function () { $('settings').showModal(); });
  $('closeSettings').addEventListener('click', function () { $('settings').close(); });
  $('settings').addEventListener('click', function (e) { if (e.target === this) this.close(); });

  $('langChoice').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    settings.lang = b.getAttribute('data-value');
    saveSettings(); markChoice('langChoice', settings.lang); applyLanguage();
  });

  $('themeChoice').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    settings.theme = b.getAttribute('data-value');
    saveSettings(); markChoice('themeChoice', settings.theme); applyTheme();
  });

  // Called by the Android back button: closes the panel first, otherwise the app leaves.
  window.handleBack = function () {
    if (!$('settings').open) return false;
    $('settings').close();
    return true;
  };

  $('versionValue').textContent = window.APP_VERSION || '';
  markChoice('langChoice', settings.lang);
  markChoice('themeChoice', settings.theme);
  applyTheme();
  applyLanguage();

  // Shared saving through the artifact; fall back to this browser only.
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (a) {
      artifact = a;
      if (!a) loadFallback();
    }).catch(loadFallback);
  } else {
    loadFallback();
  }

  function loadFallback() {
    if (state.items.length) return;
    try { var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && s.items) { state = s; render(); } } catch (_) {}
  }

  // Offline support on the web. The Android app loads from file:// and does not need it.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
  }
})();
</script></body></html>
